services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: sampletagharmonizer
      POSTGRES_USER: sampletagharmonizer
      POSTGRES_PASSWORD: sampletagharmonizer
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U sampletagharmonizer -d sampletagharmonizer"]
      interval: 5s
      timeout: 5s
      retries: 10

  api:
    build: .
    environment:
      DATABASE_URL: postgresql+psycopg://sampletagharmonizer:sampletagharmonizer@db:5432/sampletagharmonizer
      DATASET_PATH_NI: /data/native-instruments
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
    profiles:
      - app

volumes:
  postgres_data:
